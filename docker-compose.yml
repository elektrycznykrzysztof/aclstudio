services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aclmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-aclmanager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aclmanager} -d ${POSTGRES_DB:-aclmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aclmanager}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-aclmanager}?schema=public"
      PORT: 3000
      SWITCHES_JSON: '${SWITCHES_JSON:-[]}'
    ports:
      - "${HOST_PORT:-3000}:3000"

volumes:
  postgres-data:
